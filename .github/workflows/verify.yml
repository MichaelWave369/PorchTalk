name: Verify
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q porchtalk
      - name: Gate B4d CLI help (does not open sockets)
        run: python -m porchtalk.lan_cli --help
      - name: Gate B4c pairing CLI safety smoke test
        run: python -m porchtalk.pair_cli --help
      - name: Gate B4b offline encrypted-identity smoke test
        run: python scripts/demo_encrypted_identity.py
      - name: Gate B4a offline identity card + LAN plan smoke test
        run: python scripts/demo_two_pc_readiness.py
      - name: Gate B3 loopback-only TLS smoke test
        run: python scripts/demo_loopback_first_knock.py
      - name: Test offline sample
        run: python -m porchtalk.cli examples/two_porches.json --at 2026-10-12T18:00:00Z

  windows-readiness:
    name: Windows readiness (read-only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run all available unit tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Test copy-only Windows field evidence capture
        shell: pwsh
        run: .\scripts\test_capture_windows_field_evidence.ps1
      - name: Validate Windows read-only preflight report
        shell: pwsh
        run: |
          $output = & .\scripts\inspect_windows_readiness.ps1 -LocalIPv4 192.168.10.15 -PeerIPv4 192.168.10.20 -Port 54321 | ConvertFrom-Json
          if ($output.status -ne "OBSERVATION_ONLY_NOT_AN_AUTHORIZATION") { throw "Must not advertise READY" }
          if (!$output.static_rfc1918_pair_valid) { throw "Private test address plan should be syntactically valid" }
          if ($output.sockets_opened_by_this_script -or $output.firewall_modified_by_this_script -or $output.compute_authorized) { throw "Read-only invariant violated" }
          if ($output.unresolved_manual_checks.Count -lt 5) { throw "Manual blockers not surfaced" }
          $denied = & .\scripts\inspect_windows_readiness.ps1 -LocalIPv4 8.8.8.8 -PeerIPv4 192.168.10.20 -Port 54321 | ConvertFrom-Json
          if ($denied.static_rfc1918_pair_valid) { throw "Public address must never be accepted in plan" }
          Write-Output "Windows observation format and denial cases passed; no real peer was contacted."
