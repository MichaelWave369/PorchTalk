name: Deploy PorchTalk React to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: porchtalk-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy React UI
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned packages
        working-directory: web
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify offline policy controls
        working-directory: web
        run: npm run check
      - name: Build React Pages site
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
