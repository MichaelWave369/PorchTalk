[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porchtalk"
version = "0.2.0"
description = "Offline, consent-first research router for the Infinite Porch compute commons"
requires-python = ">=3.10"
dependencies = ["cryptography>=43,<49"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["porchtalk*"]
